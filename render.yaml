# Render blueprint — deploys CareCapital Exchange straight from GitHub.
#
# Nothing here needs a terminal: push the branch, point Render at this
# repository, and it reads this file. AUTH_SECRET is generated by Render on
# first deploy and kept thereafter, so no secret is ever committed.
#
# The demo runs on the file-backed store, which lives on the instance's own
# disk. On the free plan that disk is reset whenever the instance restarts, so
# the demo data returns to its seeded state — fine for showing the product, not
# for anything you need to keep. To make it durable, move to a paid instance
# and attach a disk, pointing CCX_DATA_DIR at the mount path.
services:
  - type: web
    name: carecapital-exchange
    runtime: node
    plan: free
    # Pinned rather than left to default. Render's default is whatever GitHub
    # reports as the repository's default branch, which is a setting that can
    # change without anyone touching this file.
    branch: claude/eager-darwin-kw0lca
    # Measured on a clean checkout of this branch:
    #
    #   build   peaks at ~1.6 GB (Turbopack) / ~1.4 GB (--webpack), ~25s
    #   runtime settles at ~240 MB
    #
    # The runtime figure fits any plan. The BUILD does not fit a 512 MB one,
    # and no amount of heap tuning gets it there — a 450 MB cap dies with
    # "JavaScript heap out of memory" rather than swapping. If the build log
    # shows that error, the plan's build memory is the cause, not the app.
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    # Deliberately '/'. The marketing pages touch no database, so the health
    # check returns in about 100ms and never waits on seeding. Pointing this at
    # a signed-in route would make every deploy wait for the seed.
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Signs session cookies and short-lived document links. Generated once by
      # Render; the application refuses to start in production without it.
      - key: AUTH_SECRET
        generateValue: true
      # File-backed demo store. Set DATA_DRIVER=supabase and add the Supabase
      # keys to run against a real database instead.
      - key: DATA_DRIVER
        value: local
      # Unset OpenAI credentials keep the deterministic local analyst, which
      # needs no network access and cannot invent a number.
      - key: AI_PROVIDER
        value: mock
      # The product this deployment presents. Off is also the code default, but
      # a blueprint that leaves it implicit is a blueprint whose behaviour
      # changes when a default does.
      - key: DEBT_MARKETPLACE_ENABLED
        value: "false"
      # Seeds the whole world on the first request that touches the database —
      # which is a visitor pressing "Start the demo", not the health check.
      # Measured at 2.1s for that first visitor and 0.1s for everyone after.
      # Set to false for a deployment that should start empty; one-click demo
      # sign-in and the /try door both disappear with it.
      - key: SEED_DEMO_DATA
        value: "true"
      # The public one-click demonstration at /try. This is an endpoint that
      # creates an account, so it is its own switch — turn it off for a
      # deployment that should not be open to the internet.
      - key: GUEST_DEMO_ENABLED
        value: "true"
